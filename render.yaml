services:
  - type: web
    name: supersix-studio
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run check
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /api/health
    envVars:
      - key: APP_USERNAME
        value: super6
      - key: APP_PASSWORD
        value: "1234"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
    disk:
      name: supersix-data
      mountPath: /var/data
      sizeGB: 10
